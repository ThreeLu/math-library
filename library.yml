# =====================================================================
#  Library registry — the single file that drives the homepage.
#
#  Add a book:      append an entry below.
#  Shelve a book:   set `status: shelved`. It moves to the collapsed
#                   "Shelved" section on the homepage; its pages and
#                   links keep working.
#  Plan a book:     `status: planned` with no `source` shows a card
#                   marked "In preparation".
#
#  Fields
#    slug       URL path: /books/<slug>/
#    title      display title; `subtitle` optional
#    category   courses | research | surveys
#    lang       zh | en (theorem names, UI language, typography)
#    status     active | shelved | planned
#    source     directory holding the LaTeX sources (main file inside)
#    main       main .tex file, relative to `source`
#    progress   optional progress table (进度.md format)
#    slides     optional slides PDF, offered next to the book's own PDF
# =====================================================================

site:
  title: Mathematical Notes
  description: Lecture notes, research notes and surveys.
  author: threelu
  github: threelu
  repo: math-library

categories:
  - id: courses
    title: Courses
    blurb: Graduate courses.
  - id: research
    title: Research Topics
    blurb: Working notes.
  - id: surveys
    title: Surveys
    blurb: Long-form surveys.

books:
