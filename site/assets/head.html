<!-- CJK fallbacks for readers without Songti / Kaiti installed -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<script>
// Hidden contents columns (left: the book, right: this page), set before the
// first paint so the page does not jump.
try {
  const l = JSON.parse(localStorage.getItem("yp:layout")) || {};
  if (l.left) document.documentElement.classList.add("yp-hide-left");
  if (l.right) document.documentElement.classList.add("yp-hide-right");
} catch (e) {}

document.addEventListener("DOMContentLoaded", () => {
  const zh = (document.documentElement.lang || "").startsWith("zh");
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  // ---- Book contents: a lecture's exercises as a small link on its own line,
  // in place of a section that folds out to one item (the CSS hides those).
  document.querySelectorAll("#quarto-sidebar .sidebar-item-section").forEach(sec => {
    const items = sec.querySelectorAll(":scope > ul > li");
    // (a course part with a single lecture is a section too; leave it alone)
    const hw = items.length === 1 && !items[0].classList.contains("sidebar-item-section")
      && items[0].querySelector('a[href$="-hw.html"]');
    const row = sec.querySelector(":scope > .sidebar-item-container");
    if (!hw || !row) return;
    const a = document.createElement("a");
    a.href = hw.getAttribute("href");
    a.className = "yp-side-hw" + (hw.classList.contains("active") ? " active" : "");
    a.textContent = zh ? "作业" : "Exercises";
    row.append(a);
  });

  // ---- Solutions: show all / hide all, and open the one a link points into
  const sols = document.querySelectorAll("details.yp-solution");
  if (sols.length > 1) {
    const bar = document.createElement("div");
    bar.className = "yp-solution-toggle";
    const mk = (label, open) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      b.onclick = () => sols.forEach(d => (d.open = open));
      return b;
    };
    bar.append(mk(zh ? `展开全部解答 · ${sols.length}` : `Show all solutions · ${sols.length}`, true),
               mk(zh ? "全部折叠" : "Hide all", false));
    const body = document.querySelector(".yp-body");
    const banner = body && body.querySelector(".yp-banner");
    if (banner) banner.after(bar); else if (body) body.prepend(bar);
  }
  const openTarget = () => {
    const t = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    const d = t && t.closest("details");
    if (d) d.open = true;
  };
  window.addEventListener("hashchange", openTarget);
  openTarget();

  // ---- Continue reading: remember the last page read, overall and per book
  const body = document.querySelector(".yp-body[data-book]");
  if (body) {
    const h1 = document.querySelector("h1.title");
    const entry = {
      url: location.pathname,
      label: body.dataset.crumb || (h1 ? h1.textContent.trim() : document.title),
      book: body.dataset.book,
      bookTitle: body.dataset.bookTitle || "",
      t: Date.now(),
    };
    store.set("yp:last", entry);
    store.set("yp:last:" + entry.book, entry);
  }
  const fill = (el, entry, showBook) => {
    if (!el || !entry || !entry.url || entry.url === location.pathname) return;
    el.href = entry.url;
    el.innerHTML = "";
    const w = document.createElement("span");
    w.className = "yp-continue-word";
    w.textContent = el.dataset.word;
    const l = document.createElement("span");
    l.textContent = entry.label;
    el.append(w, l);
    if (showBook && entry.bookTitle) {
      const b = document.createElement("span");
      b.className = "yp-continue-book";
      b.textContent = entry.bookTitle;
      el.append(b);
    }
    el.hidden = false;
  };
  fill(document.getElementById("yp-continue"), store.get("yp:last"), true);
  const cb = document.getElementById("yp-continue-book");
  if (cb) fill(cb, store.get("yp:last:" + cb.dataset.book), false);

  // Formulas in headings are short (σ-代数, 0-1 律, L^p): written out as text
  // they show at once, without waiting for MathJax to typeset a long page.
  const GREEK = { alpha: "α", beta: "β", gamma: "γ", delta: "δ", varepsilon: "ε", epsilon: "ε",
    eta: "η", theta: "θ", kappa: "κ", lambda: "λ", mu: "μ", nu: "ν", xi: "ξ", pi: "π", rho: "ρ",
    sigma: "σ", tau: "τ", phi: "φ", varphi: "φ", chi: "χ", omega: "ω", Gamma: "Γ", Delta: "Δ",
    Lambda: "Λ", Phi: "Φ", Omega: "Ω", infty: "∞", in: "∈", le: "≤", leq: "≤", ge: "≥", geq: "≥",
    to: "→", times: "×", cdot: "·", ldots: "…", dots: "…" };
  function plainMath(tex) {
    const span = document.createElement("span");
    const t = tex.replace(/^\\\(|\\\)$/g, "")
      .replace(/\\(?:mathbb|mathcal|mathrm|operatorname|text)\{([^}]*)\}/g, "$1")
      .replace(/\\([A-Za-z]+)/g, (m, n) => GREEK[n] !== undefined ? GREEK[n] : "");
    // ^x, ^{xy}, _x, _{xy} as superscripts and subscripts
    t.split(/([\^_](?:\{[^}]*\}|.))/).forEach(part => {
      if (/^[\^_]/.test(part)) {
        const s = document.createElement(part[0] === "^" ? "sup" : "sub");
        s.textContent = part.slice(1).replace(/^\{|\}$/g, "");
        span.append(s);
      } else span.append(part.replace(/[{}]/g, ""));
    });
    return span;
  }

  // ---- On this page: Quarto cannot see the headings inside .yp-body, so the
  // margin contents are built here, with the section being read highlighted.
  const margin = document.getElementById("quarto-margin-sidebar");
  const heads = [...document.querySelectorAll(".yp-body section > h2, .yp-body section > h3")]
    .filter(h => h.parentElement.id);
  if (margin && heads.length >= 2) {
    const nav = document.createElement("nav");
    nav.className = "yp-onpage";
    const title = document.createElement("p");
    title.className = "yp-onpage-title";
    title.textContent = zh ? "本页" : "On this page";
    const list = document.createElement("ul");
    const items = heads.map(h => {
      const a = document.createElement("a");
      a.href = "#" + h.parentElement.id;
      a.innerHTML = h.innerHTML;
      a.querySelectorAll(".anchorjs-link").forEach(x => x.remove());
      a.querySelectorAll(".math").forEach(m => m.replaceWith(plainMath(m.textContent)));
      const li = document.createElement("li");
      li.className = h.tagName === "H3" ? "yp-onpage-sub" : "";
      li.append(a);
      list.append(li);
      return a;
    });
    nav.append(title, list);
    margin.append(nav);
    let ticking = false;
    const spy = () => {
      ticking = false;
      let i = heads.findIndex(h => h.getBoundingClientRect().top > 120) - 1;
      if (i === -2) i = heads.length - 1;   // past the last heading
      items.forEach((a, k) => a.classList.toggle("active", k === i));
    };
    addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(spy); } },
                     { passive: true });
    spy();
  }

  // ---- Hide or show the contents on either side; the text widens into the
  // space. Tabs on the screen edges, keys [ and ], remembered across pages.
  const root = document.documentElement;
  const toggles = [];
  const sides = [["left", "quarto-sidebar", "[", zh ? "目录" : "contents"],
                 ["right", "quarto-margin-sidebar", "]", zh ? "本页目录" : "page contents"]];
  sides.forEach(([side, id, key, what]) => {
    if (!document.getElementById(id)) return;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "yp-edge yp-edge-" + side;
    const label = () => {
      const hidden = root.classList.contains("yp-hide-" + side);
      b.title = (hidden ? (zh ? "显示" : "Show ") : (zh ? "隐藏" : "Hide ")) + what +
                (zh ? `（${key}）` : ` (${key})`);
      b.setAttribute("aria-label", b.title);
      b.setAttribute("aria-pressed", String(hidden));
    };
    b.innerHTML = '<svg viewBox="0 0 10 16" width="8" height="13" aria-hidden="true">' +
                  '<path d="M7 2 L2 8 L7 14" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
    b.onclick = () => {
      // keep the line being read in place while the column reflows
      const main = document.querySelector("main.content");
      const r = main && main.getBoundingClientRect();
      const at = r && document.elementFromPoint(r.left + r.width / 2, Math.max(r.top, 90));
      const anchor = at && main.contains(at) ? at : null;
      const before = anchor && anchor.getBoundingClientRect().top;
      root.classList.toggle("yp-hide-" + side);
      if (anchor) scrollBy(0, anchor.getBoundingClientRect().top - before);
      store.set("yp:layout", { left: root.classList.contains("yp-hide-left"),
                               right: root.classList.contains("yp-hide-right") });
      toggles.forEach(f => f());
    };
    label();
    toggles.push(label);
    document.body.append(b);
    document.addEventListener("keydown", e => {
      if (e.key === key && !e.metaKey && !e.ctrlKey && !e.altKey &&
          !/input|textarea/i.test(document.activeElement.tagName)) b.click();
    });
  });

  // ---- Jump back: following a cross-reference remembers where it was clicked;
  // a "Back" button then returns there (one level per click, across pages).
  const BACK = "yp:back";
  const ss = {
    get() { try { return JSON.parse(sessionStorage.getItem(BACK)) || []; } catch (e) { return []; } },
    set(v) { try { sessionStorage.setItem(BACK, JSON.stringify(v.slice(-30))); } catch (e) {} },
  };
  const refSelector = "a.yp-ref, a.yp-cite, .yp-idx-item a, .yp-body a[href*='#']";
  const refLinks = () => [...document.querySelectorAll(refSelector)];
  let popOwner = null;    // the link whose preview is showing (set below)
  document.addEventListener("click", ev => {
    let a = ev.target.closest(refSelector);
    if (!a || ev.metaKey || ev.ctrlKey || ev.shiftKey || a.target === "_blank") return;
    // a link inside a preview: come back to the link that opened the preview
    if (a.closest(".yp-pop") && popOwner) a = popOwner;
    // a short name for the page: the sidebar label, else the page title
    const crumb = document.querySelector(".yp-body[data-crumb]");
    const active = document.querySelector("#quarto-sidebar a.sidebar-link.active");
    const h1 = document.querySelector("h1.title, .yp-hero-title");
    const label = crumb ? crumb.dataset.crumb
      : active ? active.textContent.trim()
      : (h1 ? h1.textContent.trim() : document.title);
    const stack = ss.get();
    stack.push({ path: location.pathname, index: refLinks().indexOf(a), y: window.scrollY,
                 label: label.slice(0, 40) });
    ss.set(stack);
    showBack();
  }, true);

  const backBtn = document.createElement("button");
  backBtn.type = "button";
  backBtn.className = "yp-back";
  backBtn.hidden = true;
  document.body.append(backBtn);
  function showBack() {
    const stack = ss.get();
    if (!stack.length) { backBtn.hidden = true; return; }
    const top = stack[stack.length - 1];
    const here = top.path === location.pathname;
    // arrow · "Back" over where it leads · key hint
    const word = document.createElement("span");
    word.className = "yp-back-word";
    word.textContent = (zh ? "返回" : "Back") + (stack.length > 1 ? ` · ${stack.length}` : "");
    const where = document.createElement("span");
    where.className = "yp-back-where";
    where.textContent = here ? (zh ? "跳转前的位置" : "where you were") : top.label;
    const text = document.createElement("span");
    text.className = "yp-back-text";
    text.append(word, where);
    const key = document.createElement("kbd");
    key.textContent = "B";
    backBtn.replaceChildren();
    backBtn.insertAdjacentHTML("afterbegin",
      '<svg class="yp-back-arrow" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">' +
      '<path d="M6.5 3.5 2.5 7.5l4 4M3 7.5h6.5a4 4 0 0 1 0 8H8" fill="none" stroke="currentColor" ' +
      'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    backBtn.append(text, key);
    backBtn.title = zh ? "回到跳转前的位置（键盘：b）" : "Return to where you were (key: b)";
    backBtn.setAttribute("aria-label", backBtn.title);
    backBtn.hidden = false;
  }
  // put the reader back at the link they followed, after the math has been typeset
  function restore(entry) {
    const go = () => {
      const link = refLinks()[entry.index];
      if (link) {
        link.scrollIntoView({ block: "center" });
        link.classList.add("yp-back-flash");
        setTimeout(() => link.classList.remove("yp-back-flash"), 1600);
      } else {
        window.scrollTo(0, entry.y);
      }
    };
    // jump at once, then re-align once MathJax has finished changing the layout
    go();
    const mj = window.MathJax && MathJax.startup && MathJax.startup.promise;
    if (mj) mj.then(() => requestAnimationFrame(go));
  }
  backBtn.addEventListener("click", () => {
    const stack = ss.get();
    const entry = stack.pop();
    ss.set(stack);
    if (!entry) return;
    if (entry.path === location.pathname) {
      history.replaceState(null, "", location.pathname);
      restore(entry);
      showBack();
    } else {
      try { sessionStorage.setItem("yp:restore", JSON.stringify(entry)); } catch (e) {}
      location.href = entry.path;
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "b" && !e.metaKey && !e.ctrlKey && !e.altKey && !backBtn.hidden &&
        !/input|textarea/i.test(document.activeElement.tagName)) backBtn.click();
  });
  try {
    const pending = JSON.parse(sessionStorage.getItem("yp:restore"));
    sessionStorage.removeItem("yp:restore");
    if (pending && pending.path === location.pathname) restore(pending);
  } catch (e) {}
  showBack();

  // ---- Previews: hovering a cross-reference shows the statement, formula,
  // exercise, figure or reference it points to. A tap with a finger or pen
  // shows the preview and a second tap (or "Go to") follows the link.
  const PREVIEW = "a.yp-ref, a.yp-cite, .yp-idx-item a";
  // Decided per event, not per device: a tablet with a trackpad or pencil
  // reports that it can hover, and a laptop may have a touch screen.
  let finger = false;
  const notePointer = e => { finger = e.pointerType === "touch" || e.pointerType === "pen"; };
  addEventListener("pointerover", notePointer, true);
  addEventListener("pointerdown", notePointer, true);
  addEventListener("keydown", () => { finger = false; }, true);
  const pages = new Map();
  const fetchPage = url => {
    if (!pages.has(url)) {
      pages.set(url, fetch(url).then(r => r.ok ? r.text() : Promise.reject(r.status))
        .then(t => new DOMParser().parseFromString(t, "text/html"))
        .catch(e => { pages.delete(url); throw e; }));
    }
    return pages.get(url);
  };
  // the part of a page that a label names, as a detached copy
  function excerpt(doc, id, base) {
    const el = id && doc.getElementById(id);
    let parts;
    if (!el || el.tagName === "SECTION") {
      // a label on a whole page or section: its title and first paragraph
      const scope = el || doc.querySelector(".yp-body");
      if (!scope) return null;
      const h = el ? el.querySelector("h1, h2, h3") : doc.querySelector("h1.title");
      const p = [...scope.querySelectorAll(":scope > p, :scope > section > p")]
        .find(x => !x.closest(".yp-banner"));
      parts = [h, p].filter(Boolean).map(x => x.cloneNode(true));
      if (h) parts[0] = Object.assign(doc.createElement("p"), { className: "yp-pop-title",
                                                               textContent: h.textContent.trim() });
    } else if (el.dataset.label && !el.textContent.trim()) {
      // exercise marker: the whole item
      parts = [(el.closest(".yp-qitem, li, p") || el).cloneNode(true)];
    } else {
      parts = [el.cloneNode(true)];
    }
    const box = document.createElement("div");
    box.append(...parts);
    box.querySelectorAll(".yp-thm-pdf, details.yp-solution, .anchorjs-link").forEach(x => x.remove());
    box.querySelectorAll("[id]").forEach(x => x.removeAttribute("id"));
    box.querySelectorAll("a[href]").forEach(x => x.href = new URL(x.getAttribute("href"), base).href);
    box.querySelectorAll("img[src]").forEach(x => x.src = new URL(x.getAttribute("src"), base).href);
    return box.textContent.trim() || box.querySelector("img") ? box : null;
  }

  const pop = document.createElement("div");
  pop.className = "yp-pop";
  pop.hidden = true;
  document.body.append(pop);
  let showTimer = 0, hideTimer = 0, seq = 0;
  function hidePop() {
    clearTimeout(showTimer);
    seq++;
    pop.hidden = true;
    popOwner = null;
  }
  function place(a) {
    const r = a.getClientRects()[0] || a.getBoundingClientRect();
    const vw = document.documentElement.clientWidth, gap = 8, edge = 16;
    pop.style.maxWidth = Math.min(36 * 16, vw - 2 * edge) + "px";
    const w = pop.offsetWidth, h = pop.offsetHeight;
    const left = Math.max(edge, Math.min(r.left, vw - edge - w));
    const below = innerHeight - r.bottom - gap >= h || r.top - gap < h;
    pop.style.left = left + scrollX + "px";
    pop.style.top = (below ? r.bottom + gap : r.top - gap - h) + scrollY + "px";
  }
  async function showPop(a) {
    const n = ++seq;
    const url = new URL(a.getAttribute("href"), location.href);
    const id = decodeURIComponent(url.hash.slice(1));
    url.hash = "";
    let doc, box;
    try { doc = await fetchPage(url.href); box = excerpt(doc, id, url.href); } catch (e) { box = null; }
    if (n !== seq) return;
    if (!box) { pop.hidden = true; popOwner = null; return; }
    // typeset like the page it comes from (Chinese or English book)
    const body = doc.querySelector(".yp-body");
    box.className = "yp-body yp-pop-body" + (body ? [...body.classList]
      .filter(c => /^yp-(zh|en)$/.test(c)).map(c => " " + c).join("") : "");
    if (finger) {
      const go = document.createElement("button");
      go.type = "button";
      go.className = "yp-pop-go";
      go.textContent = (zh ? "跳转到 " : "Go to ") + a.textContent.trim() + " →";
      go.onclick = () => { const o = popOwner; if (o) o.click(); hidePop(); };
      box.append(go);
    }
    pop.replaceChildren(box);
    popOwner = a;
    pop.style.visibility = "hidden";
    pop.hidden = false;
    place(a);
    if (window.MathJax && MathJax.typesetPromise) {
      try { await MathJax.typesetPromise([pop]); } catch (e) {}
      if (n !== seq) return;
      place(a);
    }
    pop.style.visibility = "";
  }

  // mouse: hover to preview, click to follow
  document.addEventListener("mouseover", e => {
    if (finger) return;            // the mouse events a tap also fires
    const a = e.target.closest(PREVIEW);
    if (pop.contains(e.target)) { clearTimeout(hideTimer); return; }
    if (!a) return;
    clearTimeout(hideTimer);
    if (a === popOwner && !pop.hidden) return;
    // start loading the target page now, while the hover delay runs
    fetchPage(new URL(a.href.split("#")[0], location.href).href).catch(() => {});
    clearTimeout(showTimer);
    showTimer = setTimeout(() => showPop(a), 250);
  });
  document.addEventListener("mouseout", e => {
    if (finger) return;
    const from = e.target.closest(PREVIEW) || (pop.contains(e.target) ? pop : null);
    if (!from) return;
    const to = e.relatedTarget;
    if (to && (pop.contains(to) || (popOwner && popOwner.contains(to)))) return;
    clearTimeout(showTimer);
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hidePop, 200);
  });
  // finger or pen: first tap previews, second tap follows. Captured on window,
  // before the "Back" bookkeeping on document sees the click.
  window.addEventListener("click", e => {
    if (!finger) return;
    const a = e.target.closest(PREVIEW);
    if (pop.contains(e.target)) return;
    if (!a) { if (!pop.hidden) hidePop(); return; }
    if (a === popOwner && !pop.hidden) { hidePop(); return; }   // second tap: follow
    e.preventDefault();
    e.stopPropagation();
    showPop(a);
  }, true);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !pop.hidden) hidePop(); });
  addEventListener("resize", () => { if (!pop.hidden) hidePop(); });

  // ---- Index of results: search box and kind filter ("/" focuses the box)
  const q = document.getElementById("yp-idx-q");
  if (q) {
    const items = [...document.querySelectorAll(".yp-idx-item")];
    const chips = [...document.querySelectorAll(".yp-idx-chips button")];
    const count = document.getElementById("yp-idx-count");
    let kind = "";
    const apply = () => {
      const terms = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      let n = 0;
      items.forEach(it => {
        const ok = (!kind || it.dataset.kind === kind) &&
                   terms.every(t => (it.dataset.text || "").includes(t));
        it.hidden = !ok;
        if (ok) n++;
      });
      document.querySelectorAll(".yp-idx-group, .yp-idx-book").forEach(g => {
        g.hidden = !g.querySelector(".yp-idx-item:not([hidden])");
      });
      count.textContent = `${n} of ${items.length}`;
    };
    q.addEventListener("input", apply);
    chips.forEach(c => c.addEventListener("click", () => {
      chips.forEach(x => x.classList.toggle("on", x === c));
      kind = c.dataset.kind;
      apply();
    }));
    document.addEventListener("keydown", e => {
      if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    });
    apply();
  }
});
</script>
